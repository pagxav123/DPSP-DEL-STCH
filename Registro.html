

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STCH - Crear cuenta</title>
    <link rel="stylesheet" href="Registro.css">
</head>
<body>

    <main class="contenedor">

        <section class="encabezado">
            <img src="logo.png" alt="Logo STCH">
            <h1>STCH</h1>
            <p>Sistema de Transporte Convencional de Hidalgo</p>
        </section>

        <section class="formulario">
            <h2>Crear cuenta</h2>
            <p class="descripcion">Regístrate para acceder al sistema.</p>

            <form id="formularioRegistro">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="30"
                    placeholder="Ingresa tu nombre" required>

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" maxlength="30"
                    placeholder="Ingresa tus apellidos" required>

                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" maxlength="30"
                    placeholder="Crea tu usuario" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" maxlength="50"
                    placeholder="Ingresa tu correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena"
                    placeholder="Crea una contraseña" minlength="6" required>

                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar"
                    placeholder="Repite tu contraseña" minlength="6" required>

                <button type="submit" id="botonRegistro">
                    Crear cuenta
                </button>

                <p id="mensaje" role="status"></p>

                <div class="enlace">
                    ¿Ya tienes una cuenta?
                    <a href="Login.html">Inicia sesión</a>
                </div>

            </form>
        </section>

        <p class="pie">Acceso al sistema de movilidad</p>

    </main>

    <script type="module" src="Registro.js"></script>

</body>
</html>

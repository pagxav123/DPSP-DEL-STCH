
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STCH - Iniciar sesión</title>

    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <div class="fondo">

        <div class="login-container">

            <div class="logo-seccion123">

                <img src="logo.png" alt="Logo STCH" class="logo">

                <h1>STCH</h1>

                <p>Sistema de Transporte Convencional de Hidalgo</p>

            </div>

            <div class="formulario">

                <h2>Iniciar sesión</h2>

                <form id="formularioLogin">

                    <div class="grupo">

                        <label for="usuario">Correo electrónico</label>

                        <input
                            type="email"
                            id="usuario"
                            placeholder="Ingresa tu correo electrónico"
                            required
                        >

                    </div>

                    <div class="grupo">

                        <label for="contrasena">Contraseña</label>

                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>

                    <button type="submit" id="botonEntrar">
                        Entrar
                    </button>

                    <div class="registro-link">

                        <p>¿No tienes una cuenta?</p>

                        <a href="Registro.html">Regístrate aquí</a>

                    </div>

                    <p id="mensaje"></p>

                </form>

            </div>

            <p class="pie-login">
                Acceso al sistema de movilidad
            </p>

        </div>

    </div>

    <script type="module" src="Login.js"></script>

</body>
</html>
